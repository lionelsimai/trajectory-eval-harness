[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-eval-harness"
version = "0.1.1"
description = "Per-hop trajectory grading for agents with a CI gate that blocks bad PRs"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Lionel Sim", email = "lionel@theaicapitol.com"}]
requires-python = ">=3.11"
keywords = ["ai-agents", "llm", "evaluation", "open-source"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
dependencies = []

[project.urls]
Homepage = "https://github.com/lionelsimai/trajectory-eval-harness"
Repository = "https://github.com/lionelsimai/trajectory-eval-harness"
Issues = "https://github.com/lionelsimai/trajectory-eval-harness/issues"

[project.scripts]
traj-eval = "trajectory_eval_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
